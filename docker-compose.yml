# =============================================================================
# CAW (Continuous AI Workspace) - 코어 컨테이너 구성 (docker-compose.yml)
# 목적: 프록시·멀티플렉서 중립적인 code-server 구동 및 호스트-컨테이너 간 AI 대화 저장소 일치
# 운영 원칙:
#   - 본 파일은 Git 추적 코어 파일이므로 직접 수정하지 마십시오 (git pull 충돌 원인).
#   - 호스트별 볼륨·네트워크·환경변수 확장은 compose.override.yml (.gitignore 보호)을 사용하십시오.
#   - 소켓 직결(CAW_SHARE_MUX_SOCKET=true) 및 DooD(CAW_ENABLE_DOOD=true)는
#     install.sh 가 compose.mux-socket.yml / compose.dood.yml 을 자동 결합하므로 본 파일 수정이 불필요합니다.
# =============================================================================

services:
  code-server:
    image: ${CAW_IMAGE_REPO:-lscr.io/linuxserver/code-server}:${CAW_IMAGE_TAG:-4.145.2}
    container_name: ${CAW_CONTAINER_NAME:-code-server}
    environment:
      - PUID=${PUID:-${UID:-1000}}
      - PGID=${PGID:-${GID:-1000}}
      - TZ=${TZ:-Asia/Seoul}
      - PASSWORD=${CAW_PASSWORD:-}
      - HASHED_PASSWORD=${CAW_HASHED_PASSWORD:-}
      - SUDO_PASSWORD=${CAW_SUDO_PASSWORD:-}
      - SUDO_PASSWORD_HASH=${CAW_SUDO_PASSWORD_HASH:-}
      - PROXY_DOMAIN=${CAW_PROXY_DOMAIN_TEMPLATE:-}
      - CODE_SERVER_COOKIE_SUFFIX=${CAW_COOKIE_SUFFIX:-_caw}
      # Antigravity 웹뷰 패널의 서브도메인 프록시(ide-<port>.<domain>) 허용 설정
      - AGY_ALLOWED_DOMAINS=${CAW_BASE_DOMAIN:-}
      - ANTIGRAVITY_CDE=true
      - DEFAULT_WORKSPACE=${CAW_WORKSPACE_DIR:-${HOST_HOME:-${HOME}}/workspace}
      - CAW_MULTIPLEXER=${CAW_MULTIPLEXER:-auto}
      - CAW_SESSION_NAME=${CAW_SESSION_NAME:-caw}
      - CAW_SHARE_MUX_SOCKET=${CAW_SHARE_MUX_SOCKET:-false}
      - CAW_HOST_HOME=${HOST_HOME:-${HOME}}
      - CAW_AUTO_INSTALL_EXTENSIONS=${CAW_AUTO_INSTALL_EXTENSIONS:-true}
      - CAW_ENABLE_DOOD=${CAW_ENABLE_DOOD:-false}
      # PWA 앱 이름 및 커스텀 아이콘 브랜딩 설정 (미선언 시 앱 이름 기본 CAW, 아이콘 미설정 시 code-server 기본 유지)
      - PWA_APPNAME=${CAW_PWA_APPNAME:-CAW}
      - CAW_PWA_ICON=${CAW_PWA_ICON:-}
    # 컨테이너 내부에서 에이전트의 Linux 네임스페이스 샌드박스 실행 허용
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    volumes:
      # 1. code-server 설정 및 확장 프로그램 영속 저장소 (미선언 시 사용자 데이터 디렉토리 자동 사용)
      - ${CAW_CONFIG_DIR:-${HOST_HOME:-${HOME}}/.local/share/caw/code-server-config}:/config

      # 2. AI 에이전트(Antigravity / Claude Code) 세션 및 인증 저장소 이중 매핑
      # 컨테이너 기본 HOME(/config)과 호스트 절대경로 양쪽 모두 일치시켜 심볼릭 링크 및 프로젝트 해시 호환 보장
      - ${HOST_HOME:-${HOME}}/.claude:/config/.claude
      - ${HOST_HOME:-${HOME}}/.gemini:/config/.gemini
      - ${HOST_HOME:-${HOME}}/.claude:${HOST_HOME:-${HOME}}/.claude
      - ${HOST_HOME:-${HOME}}/.gemini:${HOST_HOME:-${HOME}}/.gemini

      # 3. 호스트 로컬 바이너리 및 AI 에이전트 공용 CLI 래퍼 디렉토리 읽기 전용 연동 (유닉스 소켓 미포함)
      # 단일 파일 대신 디렉토리 마운트 + 05-cli-links.sh 심볼릭 링크를 사용하여 git pull 즉시 반영 보장
      - ${HOST_HOME:-${HOME}}/.local/bin:${HOST_HOME:-${HOME}}/.local/bin:ro
      - ./bin:/opt/caw/bin:ro

      # 4. 기기 고유 식별자 및 Git 전역 설정 읽기 전용 매핑
      - /etc/machine-id:/etc/machine-id:ro
      - ${HOST_HOME:-${HOME}}/.gitconfig:/config/.gitconfig:ro
      - ${HOST_HOME:-${HOME}}/.gitconfig:${HOST_HOME:-${HOME}}/.gitconfig:ro

      # 5. 주 작업 워크스페이스 매핑 (호스트 세션 경로 해시와 1:1 일치를 위해 동일 절대경로 사용)
      - ${CAW_WORKSPACE_DIR:-${HOST_HOME:-${HOME}}/workspace}:${CAW_WORKSPACE_DIR:-${HOST_HOME:-${HOME}}/workspace}

      # 6. 독립 기동 초기화 모듈 디렉토리
      # 각 모듈은 .env 토글로 제어하며, 호스트 전용 초기화 스크립트는 cont-init.d/9*-local*.sh (.gitignore 보호)로 추가 가능
      - ./cont-init.d:/custom-cont-init.d:ro

      # 7. 커스텀 PWA 아이콘 등 정적 자산 디렉토리 읽기 전용 매핑
      - ./assets:/opt/caw/assets:ro
    ports:
      # 보안 기본값: 127.0.0.1 바인딩으로 외부 무인증 노출 차단
      - "${CAW_BIND_ADDR:-127.0.0.1}:${CAW_PORT:-8443}:8443"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
